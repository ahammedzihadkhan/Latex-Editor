[package]
name = "inktex"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
flate2 = "1"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "system_fonts"] }
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
hayro = "0.9.0"
rfd = "0.18.0"
